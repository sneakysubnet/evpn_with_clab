frr version 10.7.1_git
frr defaults traditional
hostname spine1
!
interface eth1
 ip address 172.16.1.11 peer 172.16.1.1/32
 ip router isis 1
 isis network point-to-point
exit
!
interface eth2
 ip address 172.16.1.11 peer 172.16.1.2/32
 ip router isis 1
 isis network point-to-point
exit
!
interface lo
 ip router isis 1
exit
!
router bgp 65001
 bgp router-id 172.16.1.11
 neighbor 172.16.1.1 remote-as 65001
 neighbor 172.16.1.1 update-source lo
 neighbor 172.16.1.2 remote-as 65001
 neighbor 172.16.1.2 update-source lo
 !
 address-family l2vpn evpn
  neighbor 172.16.1.1 activate
  neighbor 172.16.1.1 route-reflector-client
  neighbor 172.16.1.2 activate
  neighbor 172.16.1.2 route-reflector-client
 exit-address-family
exit
!
router isis 1
 is-type level-2-only
 net 49.0000.0000.0000.0011.00
exit
!
