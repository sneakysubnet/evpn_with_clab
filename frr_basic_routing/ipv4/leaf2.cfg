frr version 10.7.1_git
frr defaults traditional
hostname leaf2
vrf VRF_A
vni 10100
!
interface eth11
 ip address 172.16.1.2 peer 172.16.1.11/32
 ip router isis 1
 isis network point-to-point
exit
!
interface lo
 ip router isis 1
exit
!
router bgp 65001
 bgp router-id 172.16.1.2
 neighbor 172.16.1.11 remote-as 65001
 neighbor 172.16.1.11 update-source lo
 !
 address-family l2vpn evpn
  neighbor 172.16.1.11 activate
  advertise-all-vni
 exit-address-family
exit
!
router isis 1
 is-type level-2-only
 net 49.0000.0000.0000.0002.00
exit
!
