frr version 10.5.4_git
frr defaults traditional
hostname firewall1
!
!
router bgp 100
 no bgp ebgp-requires-policy
 neighbor 172.16.11.102 remote-as 65001
 neighbor 172.16.11.102 solo
 neighbor 172.16.12.102 remote-as 65001
 neighbor 172.16.12.102 solo
 neighbor 172.16.13.102 remote-as 65001
 neighbor 172.16.13.102 solo
 !
 address-family ipv4 unicast
  neighbor 172.16.11.102 as-override
  neighbor 172.16.12.102 as-override
  neighbor 172.16.13.102 as-override
 exit-address-family
exit
!
!
segment-routing
 traffic-eng
 exit
exit
!
