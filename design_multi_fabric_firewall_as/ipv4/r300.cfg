frr version 10.5.4_git
frr defaults traditional
hostname r300
!
router bgp 300
 no bgp ebgp-requires-policy
 neighbor 172.16.1.101 remote-as 101
 neighbor 172.16.1.101 solo
 neighbor 172.16.2.201 remote-as 201
 neighbor 172.16.2.201 solo
 !
 address-family ipv4 unicast
  network 100.100.100.100/32
 exit-address-family
exit
!
segment-routing
 traffic-eng
 exit
exit
!
