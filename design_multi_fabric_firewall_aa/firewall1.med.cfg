frr version 10.5.4_git
frr defaults traditional
hostname firewall1
!
route-map SET_MED permit 5
 match as-path MED
 set as-path replace 65002 222
 set metric 100
exit
!
route-map SET_MED permit 20
exit
!
router bgp 100
 no bgp ebgp-requires-policy
 neighbor 172.16.11.102 remote-as 65001
 neighbor 172.16.11.102 solo
 neighbor 172.16.12.102 remote-as 65001
 neighbor 172.16.12.102 solo
 neighbor 172.16.13.102 remote-as 65001
 neighbor 172.16.13.102 solo
 !
 address-family ipv4 unicast
  neighbor 172.16.11.102 as-override
  neighbor 172.16.11.102 route-map SET_MED out
  neighbor 172.16.12.102 as-override
  neighbor 172.16.12.102 route-map SET_MED out
  neighbor 172.16.13.102 as-override
  neighbor 172.16.13.102 route-map SET_MED out
 exit-address-family
exit
!
bgp as-path access-list MED seq 5 permit _65002$
!
segment-routing
 traffic-eng
 exit
exit
!
end
