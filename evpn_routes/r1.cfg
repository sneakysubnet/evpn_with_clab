frr version 10.5.4_git
frr defaults traditional
hostname r1
!
router bgp 100
 no bgp ebgp-requires-policy
 neighbor 172.16.15.5 remote-as 100
 neighbor 172.16.51.5 remote-as 65000
 neighbor 172.16.51.5 solo
 neighbor 172.16.61.6 remote-as 65000
 neighbor 172.16.61.6 solo
exit
!
router ospf
 network 172.16.15.0/24 area 0
 network 172.16.51.0/24 area 0
 network 172.16.61.0/24 area 0
exit
!
segment-routing
 traffic-eng
 exit
exit
!
