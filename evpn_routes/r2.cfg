frr version 10.5.4_git
frr defaults traditional
hostname r2
!
router bgp 100
 no bgp ebgp-requires-policy
 neighbor 172.16.25.5 remote-as 100
 neighbor 172.16.52.5 remote-as 65000
 neighbor 172.16.52.5 solo
 neighbor 172.16.62.6 remote-as 65000
 neighbor 172.16.62.6 solo
exit
!
router ospf
 network 172.16.25.0/24 area 0
 network 172.16.52.0/24 area 0
 network 172.16.62.0/24 area 0
exit
!
segment-routing
 traffic-eng
 exit
exit
!
