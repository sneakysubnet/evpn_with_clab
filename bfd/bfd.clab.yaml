name: bfd
topology:
  kinds:
    ceos:
      image: ceos:4.36.1F 
    linux:
      image: quay.io/frrouting/frr:10.7.1
  nodes:
    leaf1:
      kind: ceos 
      startup-config: ipv4/leaf1.cfg
      binds:
        - capture:/tmp/
    leaf2:
      kind: ceos
      startup-config: ipv4/leaf2.cfg
      binds:
        - capture:/tmp/
    spine1:
      kind: ceos
      startup-config: ipv4/spine1.cfg
      binds:
        - capture:/tmp/ 
    spine2:
      kind: ceos
      startup-config: ipv4/spine2.cfg
      binds:
        - capture:/tmp/ 
    switch:
      kind: linux
      binds:
        - capture:/tmp/
      exec:
        - apk add tcpdump
        - ip link add br0 type bridge
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0
    host1:
      kind: linux
      exec:
        - apk add fping
        - ip link set dev eth1 address 00:aa:aa:aa:aa:aa
        - ip a a 10.10.10.10/24 dev eth1
        - ip r r default via 10.10.10.1 dev eth1
    host2:
      kind: linux
      exec:
        - apk add fping
        - ip link set dev eth1 address 00:bb:bb:bb:bb:bb
        - ip a a 10.20.20.20/24 dev eth1
        - ip r r default via 10.20.20.1 dev eth1

  links:
    - endpoints: ["spine1:eth1", "switch:eth1"]
    - endpoints: ["leaf1:eth11", "switch:eth2"]
    - endpoints: ["spine1:eth2", "leaf2:eth11"]
    - endpoints: ["spine2:eth1", "leaf1:eth12"]
    - endpoints: ["spine2:eth2", "leaf2:eth12"]


    - endpoints: ["leaf1:eth1", "host1:eth1"]
    - endpoints: ["leaf2:eth1", "host2:eth1"]

