hostname leaf102
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!

!
vrf instance A
vrf instance INSPECT
!

!
interface Ethernet11
   no switchport
   ip address unnumbered Loopback0
   isis enable 1
   isis network point-to-point
!
interface Loopback0
   ip address 172.16.1.2/32
   isis enable 1
!

!
interface Vxlan1
   vxlan source-interface Loopback0
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan vlan 20 vni 10020
   vxlan vlan 30 vni 10030
   vxlan vrf A vni 10100
!
ip virtual-router mac-address 00:88:88:88:88:88
!
ip routing
ip routing vrf A
ip routing vrf INSPECT
!
ipv6 unicast-routing
!
router bgp 65001
   maximum-paths 128
   neighbor 172.16.1.11 remote-as 65001
   neighbor 172.16.1.11 update-source Loopback0
   neighbor 172.16.1.11 send-community extended
   !

   !
   address-family evpn
      neighbor 172.16.1.11 activate
   !
   vrf A
      rd 172.16.1.1:100
      route-target import evpn 100:100
      route-target export evpn 100:100
      redistribute connected
!
router isis 1
   net 49.0000.0000.0000.0002.00
   is-type level-2
   !
   address-family ipv4 unicast
!
end
