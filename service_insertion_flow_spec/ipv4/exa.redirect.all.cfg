neighbor 172.16.11.1 {
    router-id 172.16.11.100;
    local-address 172.16.11.100;
    local-as 100;
    peer-as 65001;

    family {
        ipv4 unicast;
        ipv4 flow;
    }

    flow {
        route block-test1 {
            match {
                source 10.10.10.10/32;
                destination 10.20.20.20/32;
            }
            then {
                redirect 999:999;
            }
        }
        route block-test2 {
            match {
                source 10.20.20.20/32;
                destination 10.10.10.10/32;
            }
            then {
                redirect 999:999;
            }
        }

    }
}
