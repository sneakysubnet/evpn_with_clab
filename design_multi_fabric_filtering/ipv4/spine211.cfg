hostname spine211
!
!
ip route 172.16.2.0/24 Null0
!
interface eth1
 ip address 172.16.2.11 peer 172.16.2.1/32
 ip router isis 1
 isis network point-to-point
exit
!
interface eth2
 ip address 172.16.2.11 peer 172.16.2.2/32
 ip router isis 1
 isis network point-to-point
exit
!
interface eth10
 ip address 172.16.100.211/24
exit
!
interface lo
 ip address 172.16.2.11/32
exit
!
router bgp 65002
 no bgp ebgp-requires-policy
 neighbor 172.16.2.1 remote-as 65002
 neighbor 172.16.2.1 update-source lo
 neighbor 172.16.2.2 remote-as 65002
 neighbor 172.16.2.2 update-source lo
 neighbor 172.16.100.111 remote-as 65001
 !
 address-family ipv4 unicast
  network 172.16.2.0/24
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 172.16.2.1 activate
  neighbor 172.16.2.1 route-reflector-client
  neighbor 172.16.2.2 activate
  neighbor 172.16.2.2 route-reflector-client
  neighbor 172.16.100.111 activate
 exit-address-family
exit
!
router isis 1
 is-type level-2-only
 net 49.0000.0000.0000.0011.00
 redistribute ipv4 bgp level-2
exit
!
!
end
