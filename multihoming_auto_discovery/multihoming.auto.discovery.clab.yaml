name: multihoming-auto-discovery
topology:
  kinds:
    ceos:
      image: ceos:4.36.1F 
    linux:
      image: quay.io/frrouting/frr:10.5.4
  nodes:
    leaf1:
      kind: ceos 
      startup-config: leaf1.cfg
      binds:
        - capture:/tmp/
    leaf2:
      kind: ceos
      startup-config: leaf2.cfg
      binds:
        - capture:/tmp/
    leaf3:
      kind: ceos
      startup-config: leaf3.cfg
      binds:
        - capture:/tmp/
    leaf4:
      kind: ceos
      startup-config: leaf4.cfg
      binds:
        - capture:/tmp/

    spine1:
      kind: ceos
      startup-config: spine1.cfg
      binds:
        - capture:/tmp/ 
    spine2:
      kind: ceos
      startup-config: spine2.cfg
      binds:
        - capture:/tmp/

    host1:
      kind: linux
    host2:
      kind: linux

    host3:
      kind: linux
      exec:
        - ip link set dev eth1 address 00:cc:cc:cc:cc:cc
        - ip a a 10.10.10.30/24 dev eth1
        - ip r r default via 10.10.10.1 dev eth1
    host4:
      kind: linux
      exec:
        - ip link set dev eth1 address 00:dd:dd:dd:dd:dd
        - ip a a 10.20.20.40/24 dev eth1
        - ip r r default via 10.20.20.1 dev eth1
    host5:
      kind: linux
      exec:
        - ip link set dev eth1 address 00:ee:ee:ee:ee:ee
        - ip a a 10.10.10.50/24 dev eth1
        - ip r r default via 10.10.10.1 dev eth1
    host6:
      kind: linux
      exec:
        - ip link set dev eth1 address 00:ff:ff:ff:ff:ff
        - ip a a 10.20.20.60/24 dev eth1
        - ip r r default via 10.20.20.1 dev eth1

  links:
    - endpoints: ["spine1:eth1", "leaf1:eth11"]
    - endpoints: ["spine1:eth2", "leaf2:eth11"]
    - endpoints: ["spine1:eth3", "leaf3:eth11"]
    - endpoints: ["spine1:eth4", "leaf4:eth11"]
    - endpoints: ["spine2:eth1", "leaf1:eth12"]
    - endpoints: ["spine2:eth2", "leaf2:eth12"]
    - endpoints: ["spine2:eth3", "leaf3:eth12"]
    - endpoints: ["spine2:eth4", "leaf4:eth12"]

    - endpoints: ["leaf1:eth1", "host1:eth1"]
    - endpoints: ["leaf2:eth1", "host1:eth2"]

    - endpoints: ["leaf1:eth2", "host2:eth1"]
    - endpoints: ["leaf2:eth2", "host2:eth2"]


    - endpoints: ["leaf1:eth3", "host3:eth1"]
    - endpoints: ["leaf2:eth3", "host4:eth1"]

    - endpoints: ["leaf3:eth1", "host5:eth1"]
    - endpoints: ["leaf3:eth2", "host6:eth1"]
