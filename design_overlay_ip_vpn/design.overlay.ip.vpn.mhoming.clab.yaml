name: design-overlay-ip-vpn-mhoming
topology:
  kinds:
    ceos:
      image: ceos:4.36.1F 
    linux:
      image: quay.io/frrouting/frr:10.5.4
  nodes:
    leaf1:
      kind: ceos 
      startup-config: mhoming/leaf1.cfg
      binds:
        - capture:/tmp/
    leaf2:
      kind: ceos
      startup-config: mhoming/leaf2.cfg
      binds:
        - capture:/tmp/
    leaf3:
      kind: ceos 
      startup-config: mhoming/leaf3.cfg
      binds:
        - capture:/tmp/  
    spine1:
      kind: ceos
      startup-config: mhoming/spine1.cfg
      binds:
        - capture:/tmp/ 
    spine2:
      kind: ceos
      startup-config: mhoming/spine2.cfg
      binds:
        - capture:/tmp/ 
    host1:
      kind: linux
      exec:
        - ip link add dev bond0 type bond
        - sh -c 'echo 802.3ad > /sys/class/net/bond0/bonding/mode'
        - sh -c 'echo fast > /sys/class/net/bond0/bonding/lacp_rate'
        - sh -c 'echo layer3+4 > /sys/class/net/bond0/bonding/xmit_hash_policy'
        - ip link set dev eth1 down
        - ip link set dev eth2 down
        - ip link set dev eth1 master bond0
        - ip link set dev eth2 master bond0
        - ip link set dev bond0 up
        - ip link set dev eth1 up
        - ip link set dev eth2 up
        - ip link set dev bond0 address 00:aa:aa:aa:aa:aa
        - ip a a 10.12.10.10/24 dev bond0
        - ip r r default via 10.12.10.1 dev bond0
    host2:
      kind: linux
      exec:
        - ip link add dev bond0 type bond
        - sh -c 'echo 802.3ad > /sys/class/net/bond0/bonding/mode'
        - sh -c 'echo fast > /sys/class/net/bond0/bonding/lacp_rate'
        - sh -c 'echo layer3+4 > /sys/class/net/bond0/bonding/xmit_hash_policy'
        - ip link set dev eth1 down
        - ip link set dev eth2 down
        - ip link set dev eth1 master bond0
        - ip link set dev eth2 master bond0
        - ip link set dev bond0 up
        - ip link set dev eth1 up
        - ip link set dev eth2 up
        - ip link set dev bond0 address 00:bb:bb:bb:bb:bb
        - ip a a 10.12.10.20/24 dev bond0
        - ip r r default via 10.12.10.1 dev bond0
    host3:
      kind: linux
      exec:
        - ip link set dev eth1 address 00:cc:cc:cc:cc:cc
        - ip a a 10.3.10.30/24 dev eth1
        - ip r r default via 10.3.10.1 dev eth1


  links:
    - endpoints: ["spine1:eth1", "leaf1:eth11"]
    - endpoints: ["spine1:eth2", "leaf2:eth11"]
    - endpoints: ["spine1:eth3", "leaf3:eth11"]

    - endpoints: ["spine2:eth1", "leaf1:eth12"]
    - endpoints: ["spine2:eth2", "leaf2:eth12"]
    - endpoints: ["spine2:eth3", "leaf3:eth12"]


    - endpoints: ["leaf1:eth1", "host1:eth1"]
    - endpoints: ["leaf2:eth1", "host1:eth2"]
    - endpoints: ["leaf1:eth2", "host2:eth1"]
    - endpoints: ["leaf2:eth2", "host2:eth2"]
    - endpoints: ["leaf3:eth1", "host3:eth1"]
