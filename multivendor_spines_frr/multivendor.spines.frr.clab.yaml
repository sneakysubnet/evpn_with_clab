name: multivendor-spines-frr
topology:
  kinds:
    ceos:
      image: ceos:4.36.1F 
    linux:
      image: quay.io/frrouting/frr:10.7.1
  nodes:
    leaf1:
      kind: ceos 
      startup-config: ebgp/leaf1.cfg
      binds:
        - capture:/tmp/
    leaf2:
      kind: ceos
      startup-config: ebgp/leaf2.cfg
      binds:
        - capture:/tmp/
    spine1:
      kind: linux
      exec:
        - ip link set dev eth1 mtu 1500
        - ip link set dev eth2 mtu 1500
        - sysctl -w net.ipv6.conf.all.forwarding=1
      binds:
        - daemons:/etc/frr/daemons
        - ebgp/spine1.cfg:/etc/frr/frr.conf
        - capture:/tmp/ 
    spine2:
      kind: linux
      exec:
        - ip link set dev eth1 mtu 1500
        - ip link set dev eth2 mtu 1500
        - sysctl -w net.ipv6.conf.all.forwarding=1
      binds:
        - daemons:/etc/frr/daemons
        - ebgp/spine2.cfg:/etc/frr/frr.conf
        - capture:/tmp/ 
    host1:
      kind: linux
      exec:
        - ip link set dev eth1 address 00:aa:aa:aa:aa:aa
        - ip a a 10.10.10.10/24 dev eth1
        - ip r r default via 10.10.10.1 dev eth1
    host2:
      kind: linux
      exec:
        - ip link set dev eth1 address 00:bb:bb:bb:bb:bb
        - ip a a 10.20.20.20/24 dev eth1
        - ip r r default via 10.20.20.1 dev eth1
    host3:
      kind: linux
      exec:
        - ip link set dev eth1 address 00:cc:cc:cc:cc:cc
        - ip a a 10.10.10.30/24 dev eth1
        - ip r r default via 10.10.10.1 dev eth1
    host4:
      kind: linux
      exec:
        - ip link set dev eth1 address 00:dd:dd:dd:dd:dd
        - ip a a 10.20.20.40/24 dev eth1
        - ip r r default via 10.20.20.1 dev eth1
  links:
    - endpoints: ["spine1:eth1", "leaf1:eth11"]
    - endpoints: ["spine1:eth2", "leaf2:eth11"]

    - endpoints: ["spine2:eth1", "leaf1:eth12"]
    - endpoints: ["spine2:eth2", "leaf2:eth12"]

    - endpoints: ["leaf1:eth1", "host1:eth1"]
    - endpoints: ["leaf1:eth2", "host2:eth1"]
    - endpoints: ["leaf2:eth1", "host3:eth1"]
    - endpoints: ["leaf2:eth2", "host4:eth1"]
