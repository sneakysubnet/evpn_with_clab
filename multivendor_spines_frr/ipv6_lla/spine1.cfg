frr version 10.7.1_git
frr defaults traditional
hostname spine1
!
interface eth1
 ipv6 router isis 1
 isis network point-to-point
exit
!
interface eth2
 ipv6 router isis 1
 isis network point-to-point
exit
!
interface lo
 ip address 11.11.11.11/32
 ipv6 address fc00::11/128
 ipv6 router isis 1
exit
!
router bgp 65000
 neighbor fc00::1 remote-as 65000
 neighbor fc00::1 update-source lo
 neighbor fc00::2 remote-as 65000
 neighbor fc00::2 update-source lo
 !
 address-family l2vpn evpn
  neighbor fc00::1 activate
  neighbor fc00::1 route-reflector-client
  neighbor fc00::2 activate
  neighbor fc00::2 route-reflector-client
 exit-address-family
exit
!
router isis 1
 is-type level-2-only
 net 49.0000.0000.0000.0011.00
exit
!
