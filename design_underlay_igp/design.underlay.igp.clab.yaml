name: design-underlay-igp
topology:
  kinds:
    ceos:
      image: ceos:4.36.1F 
    linux:
      image: quay.io/frrouting/frr:10.5.4
  nodes:
    leaf1:
      kind: ceos 
      startup-config: ospfv2/leaf1.cfg
      binds:
        - capture:/tmp/
    leaf2:
      kind: ceos
      startup-config: ospfv2/leaf2.cfg
      binds:
        - capture:/tmp/
    spine1:
      kind: ceos
      startup-config: ospfv2/spine1.cfg
      binds:
        - capture:/tmp/ 
    spine2:
      kind: ceos
      startup-config: ospfv2/spine2.cfg
      binds:
        - capture:/tmp/ 
    host1:
      kind: linux
      exec:
        - ip link set dev eth1 address 00:aa:aa:aa:aa:aa
        - ip a a 10.10.10.10/24 dev eth1
        - ip r r default via 10.10.10.1 dev eth1
    host2:
      kind: linux
      exec:
        - ip link set dev eth1 address 00:bb:bb:bb:bb:bb
        - ip a a 10.10.10.20/24 dev eth1
        - ip r r default via 10.10.10.1 dev eth1

  links:
    - endpoints: ["spine1:eth1", "leaf1:eth11"]
    - endpoints: ["spine1:eth2", "leaf2:eth11"]
    - endpoints: ["spine2:eth1", "leaf1:eth12"]
    - endpoints: ["spine2:eth2", "leaf2:eth12"]

    - endpoints: ["leaf1:eth1", "host1:eth1"]
    - endpoints: ["leaf2:eth1", "host2:eth1"]
