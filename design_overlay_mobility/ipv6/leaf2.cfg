
> sh run
! Command: show running-config at line 1
! device: leaf2 (cEOSLab, EOS-4.36.1F-48405728.4361F (engineering build))
!
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$USQZFGDaUmjQDAnu$tvTCg2S1IigC69gNoC7MIQMbDZgsFGvByM4jKXlZ3KrRBPwJk6yIq.Z2GtQVlRLQwfdQ1wVcdP0JamqeZxKc//
!
management api http-commands
   no shutdown
!
no service interface inactive port-id allocation disabled
!
service routing protocols model multi-agent
!
hostname leaf2
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vlan 10,20,30
!
vrf instance A
!
management api gnmi
   transport grpc default
!
management api netconf
   transport ssh default
!
interface Ethernet1
   switchport access vlan 10
!
interface Ethernet2
   switchport access vlan 20
!
interface Ethernet11
   no switchport
   ipv6 enable
!
interface Ethernet12
   no switchport
   ipv6 enable
!
interface Loopback0
   ip address 2.2.2.2/32
   ipv6 address fc00::2/128
!
interface Management0
   ip address 172.20.20.7/24
   ipv6 address 3fff:172:20:20::7/64
!
interface Vlan10
   vrf A
   ip address virtual 10.10.10.1/24
!
interface Vlan20
   vrf A
   ip address virtual 10.20.20.1/24
!
interface Vlan30
   vrf A
   ip address virtual 10.30.30.1/24
!
interface Vxlan1
   vxlan source-interface Loopback0
   vxlan udp-port 4789
   vxlan encapsulation ipv6
   vxlan vlan 10 vni 10010
   vxlan vlan 20 vni 10020
   vxlan vlan 30 vni 10030
   vxlan vrf A vni 10100
!
ip virtual-router mac-address 00:88:88:88:88:88
!
ip routing
ip routing vrf A
!
ipv6 unicast-routing
!
router bgp 65000
   neighbor SPINES peer group
   neighbor SPINES send-community extended
   neighbor interface Ethernet11 peer-group SPINES remote-as 65000
   neighbor interface Ethernet12 peer-group SPINES remote-as 65000
   !
   vlan 10
      rd auto
      route-target both 10:10
      redistribute learned
   !
   vlan 20
      rd auto
      route-target both 20:20
      redistribute learned
   !
   vlan 30
      rd auto
      route-target both 30:30
      redistribute learned
   !
   address-family evpn
      neighbor SPINES activate
   !
   address-family ipv6
      neighbor SPINES activate
      network fc00::2/128
   !
   vrf A
      rd 2.2.2.2:100
      route-target import evpn 100:100
      route-target export evpn 100:100
      redistribute connected
!
end
